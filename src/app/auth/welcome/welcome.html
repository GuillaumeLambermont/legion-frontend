<div class="welcome-container">
  <h1>Welcome to Legion</h1>
  <p>Please log in to manage your players.</p>

  <button (click)="onLogin()" style="background: #091d0d; color: white; padding: 10px 20px; border-radius: 5px">
    Sign In
  </button>

  <button (click)="onRegister()"
    style="background: #091d0d; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
    Register
  </button>
</div>
